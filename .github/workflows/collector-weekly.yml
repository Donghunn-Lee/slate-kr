name: Collector Weekly

on:
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    # Job-level 단일 캡. step-level timeout은 사용하지 않는다 (step timeout +
    # continue-on-error 조합은 cancelled outcome을 gate가 감지해야 하는 구조인
    # 반면, job timeout은 run 자체를 fail시켜 gate 의존이 없음).
    # 비피크 ~1.5h·분기보고서 피크 ~4.6h 실측 기준, 피크 커버 + hard limit(6h)
    # 전 차단 여유.
    timeout-minutes: 330  # 분기보고서 마감 피크(2·5·8·11월) 실측 ~4.6h 기준, hosted runner 상한 6h 이내

    env:
      DATABASE_URL: ${{ secrets.NEON_DIRECT_URL }}
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      FSS_API_KEY: ${{ secrets.FSS_API_KEY }}
      KRX_OPEN_API_KEY: ${{ secrets.KRX_OPEN_API_KEY }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: collector
        run: pip install -r requirements.txt

      - name: Run fetch_stocks
        id: fetch_stocks
        working-directory: collector
        run: python fetch_stocks.py
        continue-on-error: true

      - name: Run fetch_listed_at
        id: fetch_listed_at
        working-directory: collector
        run: python fetch_listed_at.py
        continue-on-error: true

      - name: Run update_corp_codes
        id: update_corp_codes
        working-directory: collector
        run: python update_corp_codes.py --execute
        continue-on-error: true

      - name: Run fetch_shares
        id: fetch_shares
        working-directory: collector
        run: python fetch_shares.py
        continue-on-error: true

      - name: Run fetch_financials
        id: fetch_financials
        working-directory: collector
        run: python fetch_financials.py --periods 1
        continue-on-error: true

      - name: Run fetch_dividends
        id: fetch_dividends
        working-directory: collector
        run: python fetch_dividends.py --years 1
        continue-on-error: true

      # Gate: silent green 방지. success 가 아닌 모든 outcome(failure·cancelled·
      # skipped·기타)을 실패로 판정한다. weekly 는 daily 와 달리 mode/skip 조건이
      # 없으므로 skipped 는 무조건 비정상(상류 취소 징후) — daily 식 조건부 skipped
      # 분기는 불필요하고 catch-all 이 맞다.
      - name: Aggregate failure gate
        if: always()
        run: |
          fail=0
          check() {
            name=$1; outcome=$2
            if [ "$outcome" != "success" ]; then
              echo "::error::step '$name' outcome=$outcome"
              fail=1
            fi
          }
          check fetch_stocks       "${{ steps.fetch_stocks.outcome }}"
          check fetch_listed_at    "${{ steps.fetch_listed_at.outcome }}"
          check update_corp_codes  "${{ steps.update_corp_codes.outcome }}"
          check fetch_shares       "${{ steps.fetch_shares.outcome }}"
          check fetch_financials   "${{ steps.fetch_financials.outcome }}"
          check fetch_dividends    "${{ steps.fetch_dividends.outcome }}"
          if [ "$fail" = "1" ]; then
            exit 1
          fi
