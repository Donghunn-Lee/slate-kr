name: Collector Quote Snapshots

on:
  # 평일 KST 20:10 (=11:10 UTC): NXT 애프터마켓 20:00 마감 후 UN 통합 스냅샷.
  # 정각 회피(정시 트래픽 몰림 방지). fetch_quote_snapshots.py 내부 게이트가
  # 20:05 미만·휴장일이면 skip 후 정상 종료 — schedule/dispatch 어느 경로여도
  # end 캡 관례 유지(#098).
  schedule:
    - cron: "10 11 * * 1-5"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.NEON_DIRECT_URL }}
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: collector
        run: pip install -r requirements.txt

      - name: Run fetch_quote_snapshots
        working-directory: collector
        run: python fetch_quote_snapshots.py
