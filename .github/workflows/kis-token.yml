name: KIS Token

on:
  workflow_dispatch:

jobs:
  issue:
    runs-on: ubuntu-latest
    # Job-level 단일 캡. step-level timeout 은 사용하지 않는다 (step timeout +
    # continue-on-error 조합은 cancelled outcome 을 gate 가 감지해야 하는 구조인
    # 반면, job timeout 은 run 자체를 fail 시켜 gate 의존이 없음). 실측 ~1분 —
    # ~2배(2분)는 pip install 변동에 빠듯해 5분.
    timeout-minutes: 5

    env:
      DATABASE_URL: ${{ secrets.NEON_DIRECT_URL }}
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: collector
        run: pip install -r requirements.txt

      - name: Run issue_kis_token
        working-directory: collector
        run: python issue_kis_token.py
