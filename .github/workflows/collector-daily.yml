name: Collector Daily

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "full = 국내 EOD + 해외 EOD 전체 / overseas-only = 해외 EOD 만"
        type: choice
        options:
          - full
          - overseas-only
        default: full

jobs:
  collect:
    runs-on: ubuntu-latest
    # Job-level 단일 캡. step-level timeout은 사용하지 않는다 (step timeout +
    # continue-on-error 조합은 cancelled outcome을 gate가 감지해야 하는 구조인
    # 반면, job timeout은 run 자체를 fail시켜 gate 의존이 없음). 실측 대비 ~2배 여유.
    timeout-minutes: 120

    env:
      DATABASE_URL: ${{ secrets.NEON_DIRECT_URL }}
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      FSS_API_KEY: ${{ secrets.FSS_API_KEY }}
      KRX_OPEN_API_KEY: ${{ secrets.KRX_OPEN_API_KEY }}
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: collector
        run: pip install -r requirements.txt

      - name: Run fetch_market_calendar
        id: fetch_market_calendar
        working-directory: collector
        run: python fetch_market_calendar.py
        continue-on-error: true

      # 국내 스텝 실행 조건: inputs.mode 로 제어.
      #   full(기본값) → 국내+해외 전체 실행.
      #   overseas-only → 국내 skip, 해외만 실행 (예: 국내는 정상, 해외만 재수집 · 토요일 US 금요일 마감분).
      # fetch_stocks 는 fetch_daily_close 앞 — 신규 상장 종목이 당일 EOD 대상에 들어가야 한다.
      # 비거래일이면 내부 guard 가 skip 후 정상 종료(success).
      - name: Run fetch_stocks
        id: fetch_stocks
        if: ${{ inputs.mode != 'overseas-only' }}
        working-directory: collector
        run: python fetch_stocks.py
        continue-on-error: true

      # fetch_daily_close.py 내부 게이트: KST 20:05 미만·휴장일이면 skip 후 정상 종료 —
      # 그 경우 verify 가 MAX(date) 불일치로 실패해 시각 오류를 드러낸다.
      - name: Run fetch_daily_close
        id: fetch_daily_close
        if: ${{ inputs.mode != 'overseas-only' }}
        working-directory: collector
        run: python fetch_daily_close.py
        continue-on-error: true

      - name: Run fetch_index_prices
        id: fetch_index_prices
        if: ${{ inputs.mode != 'overseas-only' }}
        working-directory: collector
        run: python fetch_index_prices.py
        continue-on-error: true

      - name: Run fetch_overseas_indices
        id: fetch_overseas_indices
        working-directory: collector
        run: python fetch_overseas_indices.py
        continue-on-error: true

      # verify 앞 — 게이트를 통과한 기업행위만 rescale 하고, 거절·실패는 exit 1 로 남긴다
      # (미처리 건은 이어지는 verify 도 FAIL). 사건일 행을 쓰는 fetch_daily_close 가 실패한 날은 돌리지 않는다.
      - name: Run rescale_corp_actions
        id: rescale_corp_actions
        if: ${{ inputs.mode != 'overseas-only' && steps.fetch_daily_close.outcome == 'success' }}
        working-directory: collector
        run: python rescale_corp_actions.py
        continue-on-error: true

      - name: Verify daily freshness
        id: verify_freshness
        working-directory: collector
        run: python verify_daily_freshness.py --mode ${{ inputs.mode || 'full' }}
        continue-on-error: true

      # EOD·검증 뒤 — KRX 호출·bps 재계산이 EOD 적재를 늦추지 않게 한다.
      # 비거래일이면 내부 guard 가 skip 후 정상 종료(success).
      - name: Run fetch_shares
        id: fetch_shares
        if: ${{ inputs.mode != 'overseas-only' }}
        working-directory: collector
        run: python fetch_shares.py
        continue-on-error: true

      # rescale 산출물(SQL · 스냅샷 · summary). 미처리 0건이면 디렉토리가 없어 업로드하지 않는다.
      - name: Upload corp action artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: corp-actions-${{ github.run_id }}
          path: collector/logs/corp_actions/
          if-no-files-found: ignore

      # Gate: silent green 방지. 위 스텝 중 하나라도 실패·취소·의도치 않은 skip 이면
      # 워크플로우 실패로 만든다.
      #   failure/cancelled → 항상 실패로 판정
      #   skipped           → 해당 step 이 이 mode 에서 실행 예정이었는지 기준으로 판정
      #                       (mode=overseas-only 일 때 domestic 3종 skip 은 정상)
      - name: Aggregate failure gate
        if: always()
        env:
          MODE: ${{ inputs.mode || 'full' }}
        run: |
          fail=0
          check() {
            name=$1; outcome=$2; expected_to_run=$3
            case "$outcome" in
              success) ;;
              failure|cancelled)
                echo "::error::step '$name' outcome=$outcome"
                fail=1
                ;;
              skipped)
                if [ "$expected_to_run" = "yes" ]; then
                  echo "::error::step '$name' unexpectedly skipped (mode=$MODE) — likely upstream cancellation"
                  fail=1
                fi
                ;;
              *)
                echo "::error::step '$name' unknown outcome=$outcome"
                fail=1
                ;;
            esac
          }
          if [ "$MODE" = "overseas-only" ]; then
            domestic_expected=no
          else
            domestic_expected=yes
          fi
          check fetch_market_calendar  "${{ steps.fetch_market_calendar.outcome }}"  yes
          check fetch_stocks           "${{ steps.fetch_stocks.outcome }}"           "$domestic_expected"
          check fetch_daily_close      "${{ steps.fetch_daily_close.outcome }}"      "$domestic_expected"
          check fetch_index_prices     "${{ steps.fetch_index_prices.outcome }}"     "$domestic_expected"
          check fetch_overseas_indices "${{ steps.fetch_overseas_indices.outcome }}" yes
          # fetch_daily_close 실패로 skip 된 rescale 은 정상 — 실패는 fetch_daily_close 가 올린다.
          rescale_expected=$domestic_expected
          [ "${{ steps.fetch_daily_close.outcome }}" = "success" ] || rescale_expected=no
          check rescale_corp_actions   "${{ steps.rescale_corp_actions.outcome }}"   "$rescale_expected"
          check verify_freshness       "${{ steps.verify_freshness.outcome }}"       yes
          check fetch_shares           "${{ steps.fetch_shares.outcome }}"           "$domestic_expected"
          if [ "$fail" = "1" ]; then
            exit 1
          fi
